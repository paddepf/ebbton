name: Release

on:
  push:
    tags:
      - 'v*'

defaults:
  run:
    working-directory: app

jobs:
  # Vor dem Bauen: Passt der Tag zur Version in package.json, laufen die Tests?
  # Danach wird ein Entwurf des Releases angelegt, in den beide Builds hochladen.
  # Läuft auf Windows, wo die App wirklich läuft: Unter Ubuntu scheiterte v1.0.6 an einem Test,
  # der dort eine fehlende Systembibliothek (libpulse) brauchte – irrelevant für die App.
  vorbereiten:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash          # Git Bash; die Schritte sind Shell-Skripte
        working-directory: app
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # alle Tags und Commits, für die Versionshinweise

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Tag und Version vergleichen
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME passt nicht zur Version $VERSION in app/package.json."
            exit 1
          fi

      - name: Abhängigkeiten installieren
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Tests
        run: npm test

      # Versionshinweise = Commit-Titel seit dem vorigen Release (ohne „Version x.y.z“). Die App zeigt sie im
      # Update-Dialog unter „Was ist neu?“. Ohne Text setzte GitHub die Tag-Nachricht ein (nichtssagend).
      - name: Versionshinweise zusammenstellen
        run: |
          PREV=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_REF_NAME^" 2>/dev/null || true)
          RANGE=${PREV:+$PREV..}$GITHUB_REF_NAME
          # Interne Commits (Doku, Tests, CI, Release-Workflow, Präfix „Intern:“) gehören nicht in den Update-Dialog.
          git log "$RANGE" --no-merges --pretty='- %s' \
            | grep -v -E '^- Version v?[0-9]+(\.[0-9]+)*$' \
            | grep -v -E '^- (Doku|Tests?|CI|Intern|Release-Vorbereitung|Release-Workflow)([: ]|$)' \
            | awk '!seen[$0]++' > "$RUNNER_TEMP/notes.md" || true
          [ -s "$RUNNER_TEMP/notes.md" ] || echo '- Kleinere Verbesserungen' > "$RUNNER_TEMP/notes.md"
          echo "Seit ${PREV:-Beginn}:"; cat "$RUNNER_TEMP/notes.md"

      - name: Release-Entwurf anlegen
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows:
    needs: vorbereiten
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Bauen und hochladen
        run: npm run publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Mac-Releases sind vorerst abgeschaltet (kein Bedarf). Wieder einschalten: Repository-Variable
  # MAC_RELEASE = true (Settings → Secrets and variables → Actions → Variables).
  macos:
    needs: vorbereiten
    if: vars.MAC_RELEASE == 'true'
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Bauen und hochladen
        shell: bash
        run: |
          if [ -n "$CSC_LINK" ]; then
            npm run publish:mac
          else
            # Ohne Zertifikat ad hoc signieren: Auf Apple Silicon startet eine gar nicht signierte App
            # sonst mit der Meldung „beschädigt“. Gatekeeper fragt trotzdem einmal nach („Dennoch öffnen“).
            # Die leere Variable (fehlendes Secret) muss weg, sonst liest electron-builder sie als Dateipfad.
            unset CSC_LINK CSC_KEY_PASSWORD
            npm run publish:mac -- -c.mac.identity=-
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signiert wird erst, wenn diese Secrets im Repository hinterlegt sind;
          # notarisiert zusätzlich erst, wenn in package.json build.mac.notarize
          # auf true steht. Ohne Secrets entsteht eine ad hoc signierte App:
          # nutzbar, aber ohne automatische Updates.
          CSC_LINK: ${{ secrets.MAC_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

  # Erst wenn alle Builds hochgeladen sind, wird der Entwurf veröffentlicht. So sehen die
  # Aufnahmerechner nie ein Release, dem noch Dateien (z. B. latest.yml) fehlen. Ein übersprungener
  # Mac-Build (MAC_RELEASE nicht gesetzt) hält die Freigabe nicht auf, ein fehlgeschlagener schon.
  veroeffentlichen:
    needs: [windows, macos]
    if: always() && needs.windows.result == 'success' && (needs.macos.result == 'success' || needs.macos.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Release freigeben
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
